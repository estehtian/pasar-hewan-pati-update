<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PASAR HEWAN PATI</title><link rel="stylesheet" href="assets/style.css"></head><body><header><b>PASAR HEWAN <span>PATI</span></b><nav><a href="index.html">Katalog</a><a href="dashboard/index.html">Dashboard</a></nav></header><main><section class="hero"><small>EKOSISTEM PERDAGANGAN TERNAK DIGITAL</small><h1>Temukan ternak<br><span>terverifikasi.</span></h1><p>Marketplace hewan ternak untuk Pati dan sekitarnya.</p></section><section><h2>Katalog aktif</h2><input id="q" placeholder="Cari jenis, ras, kode, lokasi"><div id="items">Memuat katalog…</div></section></main><script src="assets/config.js"></script><script>const el=document.querySelector('#items');async function load(){try{let r=await fetch(PHP_CONFIG.API_BASE_URL+'/api/animals?q='+encodeURIComponent(document.querySelector('#q').value));let d=await r.json();el.innerHTML=d.items.length?d.items.map(x=>`<article><small>${x.listing_code} · ${x.location_name}</small><h3>${x.animal_type} ${x.breed||''}</h3><p>${x.sex||'—'} · ${x.age_months??'—'} bulan · ${x.weight_kg??'—'} kg</p><b>${x.price_idr?'Rp '+Number(x.price_idr).toLocaleString('id-ID'):'Hubungi penjual'}</b></article>`).join(''):'Belum ada iklan aktif.'}catch(e){el.textContent='Katalog belum terhubung ke backend.'}}document.querySelector('#q').addEventListener('input',load);load();</script></main></body></html>
