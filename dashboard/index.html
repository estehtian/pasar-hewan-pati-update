<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard PASAR HEWAN PATI</title><link rel="stylesheet" href="../assets/style.css"></head><body><header><b>PASAR HEWAN <span>PATI</span></b><nav><a href="../index.html">Katalog publik</a></nav></header><main><section class="hero compact"><small>PANEL OPERASIONAL</small><h1>Dashboard <span>Marketplace.</span></h1><p>Masuk sebagai admin atau penjual terdaftar.</p></section><section id="loginbox" class="panel"><h2>Masuk</h2><form id="login"><input name="email" type="email" placeholder="Email" required><input name="password" type="password" placeholder="Password" required><button>Login</button></form><p id="msg"></p></section><section id="app" hidden><div id="stats" class="stats"></div><div class="panel"><h2>Ajukan iklan hewan</h2><form id="new" class="form"><input name="animal_type" placeholder="Jenis hewan" required><input name="breed" placeholder="Ras"><input name="sex" placeholder="Jantan / Betina"><input name="age_months" type="number" placeholder="Umur (bulan)"><input name="weight_kg" type="number" step=".1" placeholder="Berat (kg)"><input name="price_idr" type="number" placeholder="Harga (Rp)"><input name="location_name" placeholder="Lokasi" required><input name="photo_url" placeholder="URL foto"><textarea name="description" placeholder="Deskripsi"></textarea><button>Kirim untuk approval</button></form><p id="notice"></p></div><div class="panel"><h2>Daftar iklan</h2><div id="rows"></div></div></section></main><script src="../assets/config.js"></script><script>
let token='',me=null;const $=s=>document.querySelector(s),api=PHP_CONFIG.API_BASE_URL;
async function call(path,opt={}){let r=await fetch(api+path,{...opt,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}});let d=await r.json();if(!r.ok)throw Error(d.error||'Gagal');return d}
$('#login').onsubmit=async e=>{e.preventDefault();try{let d=await (await fetch(api+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))})).json();if(!d.token)throw Error(d.error);token=d.token;me=d.user;$('#loginbox').hidden=true;$('#app').hidden=false;await refresh()}catch(x){$('#msg').textContent=x.message}};
async function refresh(){let [s,l]=await Promise.all([call('/api/dashboard/summary'),call('/api/animals/mine')]);$('#stats').innerHTML=Object.entries(s).map(([k,v])=>`<article><small>${k}</small><h2>${v}</h2></article>`).join('');$('#rows').innerHTML=l.items.map(x=>`<article><b>${x.listing_code} · ${x.animal_type} ${x.breed||''}</b><p>${x.location_name} · ${x.status}</p>${me.role==='admin'&&x.status==='pending'?`<button onclick="review('${x.id}','active')">Setujui</button> <button class="alt" onclick="review('${x.id}','rejected')">Tolak</button>`:''}</article>`).join('')||'Belum ada iklan.'}
window.review=async(id,decision)=>{let note=decision==='rejected'?(prompt('Alasan penolakan')||'Perlu perbaikan'):'';try{await call('/api/admin/animals/'+id+'/review',{method:'POST',body:JSON.stringify({decision,note})});await refresh()}catch(e){alert(e.message)}};
$('#new').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));let data={...f,age_months:f.age_months?+f.age_months:null,weight_kg:f.weight_kg?+f.weight_kg:null,price_idr:f.price_idr?+f.price_idr:null,photo_urls:f.photo_url?[f.photo_url]:[]};delete data.photo_url;try{let d=await call('/api/animals',{method:'POST',body:JSON.stringify(data)});$('#notice').textContent=d.message;e.target.reset();await refresh()}catch(x){$('#notice').textContent=x.message}};
</script></body></html>
